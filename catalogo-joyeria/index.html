<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon — monograma de marca -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#0b251b" />
    <meta name="theme-color" content="#0b251b" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO base — cada página puede sobreescribir title/description con useDocumentMeta -->
    <title>Alpez Joyería — Oro 18k y Oro Laminado 18k</title>
    <meta
      name="description"
      content="Catálogo de joyería fina en oro 18k y oro laminado 18k. Piezas seleccionadas y asesoría personalizada por WhatsApp."
    />

    <!-- Open Graph — cómo se ve el sitio al compartirlo en redes/WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alpez Joyería" />
    <meta property="og:title" content="Alpez Joyería — Oro 18k y Oro Laminado 18k" />
    <meta
      property="og:description"
      content="Catálogo de joyería fina en oro 18k y oro laminado 18k. Piezas seleccionadas y asesoría personalizada por WhatsApp."
    />
    <meta property="og:locale" content="es_CO" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alpez Joyería" />
    <meta
      name="twitter:description"
      content="Catálogo de joyería fina en oro 18k y oro laminado 18k."
    />

    <!-- Precarga de la tipografía de marca -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
